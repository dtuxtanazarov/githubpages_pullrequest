name: Deploy to GitHub Pages (PR only)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Reponi yuklash
        uses: actions/checkout@v4

      - name: Pages uchun artifact tayyorlash
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: GitHub Pages ga deploy
        uses: actions/deploy-pages@v4
